name: ilan-tarama

on:
  schedule:
    - cron: "17 3 * * *"   # her gün 06:17 (Türkiye saati)
    - cron: "17 11 * * *"  # her gün 14:17 (birikimi eritmek ve gün içi ilanlar için)
  workflow_dispatch:        # elle çalıştırma düğmesi

permissions:
  contents: write

concurrency:
  group: ilan-tarama
  cancel-in-progress: false

jobs:
  tara:
    runs-on: ubuntu-latest
    timeout-minutes: 140
    steps:
      # Kuyrukta bekleyen çalışma da depodaki EN SON durumdan başlasın (eski commit'ten değil)
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Araçları kur (OCR, PDF)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q tesseract-ocr tesseract-ocr-tur poppler-utils

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python paketleri
        run: pip install requests beautifulsoup4 pillow

      - name: Tara
        timeout-minutes: 110
        env:
          SURE_LIMIT_DK: "95"
        run: python tara.py

      # Tarama hata verse ya da süre aşımına uğrasa bile o ana kadar toplananlar kaydedilir.
      - name: Sonuçları kaydet
        if: always()
        run: |
          git config user.name "ilan-bot"
          git config user.email "ilan-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Değişiklik yok"
            exit 0
          fi
          git commit -q -m "tarama $(date -u +%F)"
          for i in 1 2 3; do
            git pull --rebase -q && git push && exit 0
            sleep 10
          done
          exit 1
