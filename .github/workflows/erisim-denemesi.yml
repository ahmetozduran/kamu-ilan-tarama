name: erisim-denemesi
on: workflow_dispatch
jobs:
  dene:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: kesif
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import re, urllib.request, json
          UA = "kamu-ilan-tarama/1.0 (kisisel ilan takibi; github.com/ahmetozduran/kamu-ilan-tarama)"
          def get(u, data=None, ct=None):
              r = urllib.request.Request(u, data=data, headers={"User-Agent": UA, **({"Content-Type": ct} if ct else {})})
              try:
                  with urllib.request.urlopen(r, timeout=25) as y:
                      return y.status, y.read().decode("utf-8", "replace")
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode("utf-8", "replace")
              except Exception as e:
                  return 0, repr(e)
          s, c = get("https://kariyerkapisi.gov.tr/js/Index/Main.dit3odhcc9.js")
          for mm in list(re.finditer(r"ilanObject", c))[:4]:
              print("--- ctx:", c[max(0, mm.start()-700):mm.end()+300].replace("\n", " ")[:1200])
          A = "https://api.kariyerkapisi.gov.tr/api"
          print("=== robots", get("https://api.kariyerkapisi.gov.tr/robots.txt")[0])
          s, t = get(A + "/ilan/GetIlanCountForKurumPublic"); print("=== count", s, t[:800])
          s, t = get(A + "/ilan/GetIseAlimPage", json.dumps({}).encode(), "application/json"); print("=== page{}", s, t[:1500])
          PY
