name: erisim-denemesi
on: workflow_dispatch
jobs:
  dene:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: kesif
        continue-on-error: true
        run: |
          UA="kamu-ilan-tarama/1.0 (kisisel ilan takibi; github.com/ahmetozduran/kamu-ilan-tarama)"
          curl -sS -m 30 -A "$UA" -o m.html https://www.ilan.gov.tr/
          js=$(grep -oE 'src="main-es2015[^"]*\.js"' m.html | sed 's/src="//;s/"//')
          curl -sS -m 30 -A "$UA" -o main.js "https://www.ilan.gov.tr/$js"
          echo "--- AdsByFilter baglami"; grep -oE '.{0,400}AdsByFilter.{0,600}' main.js | head -c 2500; echo
          echo "--- GetAdDetail baglami"; grep -oE '.{0,200}GetAdDetail\?.{0,300}' main.js | head -c 1200; echo
          echo "--- remoteServiceBaseUrl"; grep -oE '.{0,80}(remoteServiceBaseUrl|apiUrl|baseUrl).{0,120}' main.js | head -5
          curl -sS -m 20 -A "$UA" https://www.ilan.gov.tr/assets/appconfig.production.json; echo
          curl -sS -m 20 -A "$UA" https://www.ilan.gov.tr/assets/appconfig.json; echo
          echo "--- KK Main.js"
          curl -sS -m 30 -A "$UA" -o k.html https://kariyerkapisi.gov.tr/isealim
          kj=$(grep -oE 'src="/js/Index/Main[^"]*"' k.html | sed 's/src="//;s/"//')
          curl -sS -m 30 -A "$UA" "https://kariyerkapisi.gov.tr$kj" | head -c 4000; echo
